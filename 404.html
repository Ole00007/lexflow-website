<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page not found · LexFlow</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/lexflow-logo-120.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .nf{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:48px 24px}
  .nf h1{font-size:56px}
  .nf .code{font-family:'Instrument Serif',serif;font-size:96px;color:var(--gold);line-height:1}
</style>
</head>
<body>
<div class="nf">
  <div class="code">404</div>
  <h1>This page has left the building.</h1>
  <p class="lede">The page you're looking for doesn't exist or has moved.</p>
  <a class="btn btn-gold" href="lexflow-index.html">Back to LexFlow home</a>
</div>
<!-- COOKIE CONSENT BANNER -->
<div class="cookie-banner" id="cookieBanner" role="dialog" aria-label="Cookie consent">
  <p data-i18n="cookie_text">We use local storage only for your language and theme preferences. No advertising trackers. Read our <a href="privacy.html">Privacy Policy</a>.</p>
  <div class="cookie-actions">
    <button class="btn btn-gold" id="cookieAccept" type="button" data-i18n="cookie_accept">Accept</button>
    <button class="btn btn-ghost" id="cookieDecline" type="button" data-i18n="cookie_decline">Decline</button>
  </div>
</div>
<script>
(function(){
  var banner = document.getElementById('cookieBanner');
  if (!banner) return;
  var saved = localStorage.getItem('lexflow-cookie');
  if (saved === 'accepted' || saved === 'declined') { banner.style.display = 'none'; return; }
  function decide(v){ localStorage.setItem('lexflow-cookie', v); banner.style.display = 'none'; }
  window.LEXFLOW_showCookieBanner = function () {
    var b = document.getElementById('cookieBanner');
    if (b) { b.style.display = ''; }
  };
  var acc = document.getElementById('cookieAccept');
  var dec = document.getElementById('cookieDecline');
  if (acc) acc.addEventListener('click', function(){ decide('accepted'); });
  if (dec) dec.addEventListener('click', function(){ decide('declined'); });
})();
</script>
<!-- /COOKIE CONSENT -->
</body>
</html>
