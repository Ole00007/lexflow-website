<!DOCTYPE html>

<body>
<div class="nf">
  <div class="code">404</div>

  <p class="lede">The page you're looking for doesn't exist or has moved.</p>
  <a class="btn btn-gold" href="lexflow-index.html">Back to LexFlow home</a>

<script src="assets/webmcp.js" defer></script>
<!-- COOKIE CONSENT CMP:START -->
<style>
  .cc-overlay{position:fixed;inset:0;z-index:10000;background:rgba(8,12,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 16px 20px;backdrop-filter:blur(2px)}
  .cc-overlay[hidden]{display:none !important}
  .cc-panel[hidden]{display:none !important}
  .cc-panel{max-width:640px;width:100%;background:var(--surface,#0F1826);border:1px solid var(--border,rgba(212,175,55,.18));border-radius:18px;padding:22px 22px 18px;box-shadow:0 22px 60px rgba(0,0,0,.5);max-height:82vh;overflow:auto}
  .cc-panel h2{font-size:17px;margin:0 0 8px;color:var(--text,#F2EFE9)}
  .cc-panel p{font-size:13.5px;line-height:1.5;color:var(--text-dim,#B9C2D0);margin:0 0 14px}
  .cc-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
  .cc-btn{flex:1 1 180px;min-height:46px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;padding:0 14px;transition:all .2s}
  .cc-btn-primary{background:var(--gold,#D4AF37);color:#152238;border-color:var(--gold,#D4AF37)}
  .cc-btn-primary:hover{background:var(--gold-deep,#C5A55A)}
  .cc-btn-ghost{background:transparent;color:var(--text,#F2EFE9);border-color:var(--border,rgba(212,175,55,.18))}
  .cc-btn-ghost:hover{border-color:var(--gold,#D4AF37);color:var(--gold,#D4AF37)}
  .cc-links{display:flex;gap:16px;justify-content:center;margin:6px 0;flex-wrap:wrap}
  .cc-links a{font-size:13px;font-weight:500;color:var(--text-dim,#B9C2D0);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold,#D4AF37);cursor:pointer;padding:4px 2px;display:inline-block}
  .cc-links a:hover{color:var(--gold,#D4AF37)}
  .cc-row{display:flex;flex-direction:column;gap:14px;margin:14px 0}
  .cc-cat{border:1px solid var(--border,rgba(212,175,55,.14));border-radius:12px;padding:12px 14px;background:rgba(24,36,58,.4)}
  .cc-cat-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .cc-cat h3{font-size:14px;margin:0 0 4px;color:var(--text,#F2EFE9)}
  .cc-cat p{font-size:12.5px;margin:0;line-height:1.45}
  .cc-toggle{position:relative;flex:0 0 auto;width:40px;height:22px;margin-top:2px}
  .cc-toggle input{opacity:0;width:0;height:0;position:absolute}
  .cc-slider{position:absolute;inset:0;background:rgba(124,138,160,.35);border-radius:999px;transition:.2s;cursor:pointer}
  .cc-slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#F2EFE9;border-radius:50%;transition:.2s}
  .cc-toggle input:checked + .cc-slider{background:var(--gold,#D4AF37)}
  .cc-toggle input:checked + .cc-slider:before{transform:translateX(18px)}
  .cc-toggle input:focus-visible + .cc-slider{box-shadow:0 0 0 3px rgba(212,175,55,.4)}
  .cc-always{font-size:11px;color:var(--text-faint,#7C8AA0);text-transform:uppercase;letter-spacing:.04em}
  .cc-modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .cc-modal-actions .cc-btn{flex:1 1 150px}
  .cc-x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:none;background:transparent;color:var(--text-dim,#B9C2D0);font-size:20px;line-height:1;cursor:pointer;border-radius:8px}
  .cc-x:hover{color:var(--gold,#D4AF37);background:rgba(212,175,55,.1)}
  .cc-panel.r{position:relative}
  .cc-back{margin-top:12px;text-align:center}
  .cc-back button{background:none;border:none;color:var(--text-faint,#7C8AA0);font-size:12.5px;text-decoration:underline;cursor:pointer}
  .cc-back button:hover{color:var(--gold,#D4AF37)}
  @media (max-width:360px){.cc-overlay{padding:0 10px 12px}.cc-panel{padding:16px 14px}.cc-btn{flex:1 1 100%}}
</style>
<div class="cc-overlay" id="ccOverlay" hidden>
  <div class="cc-panel r" id="ccBanner" role="dialog" aria-modal="true" aria-live="polite" tabindex="-1">
    <button class="cc-x" id="ccClose" aria-label="Close"></button>
    <h2 id="ccBannerTitle"></h2>
    <p id="ccBannerBody"></p>
    <div class="cc-actions">
      <button class="cc-btn cc-btn-primary" id="ccAcceptAll"></button>
      <button class="cc-btn cc-btn-primary" id="ccReject"></button>
      <button class="cc-btn cc-btn-ghost" id="ccManage"></button>
    </div>
    <div class="cc-links">
      <a href="privacy.html" id="ccPrivacyLink"></a>
      <a href="cookie-policy.html" id="ccPolicyLink"></a>
    </div>
  </div>

  <div class="cc-panel r" id="ccModal" role="dialog" aria-modal="true" hidden tabindex="-1">
    <button class="cc-x" id="ccModalClose" aria-label="Close"></button>
    <h2 id="ccPrefTitle"></h2>
    <p id="ccPrefIntro"></p>
    <div class="cc-row" id="ccCats">
      <div class="cc-cat">
        <div class="cc-cat-head">
          <div><h3 id="ccCatNeededH"></h3><p id="ccCatNeededP"></p></div>
          <span class="cc-always" id="ccCatNeededAlways"></span>
        </div>
      </div>
      <div class="cc-cat">
        <div class="cc-cat-head">
          <div><h3 id="ccCatFunctionalH"></h3><p id="ccCatFunctionalP"></p></div>
          <label class="cc-toggle"><input type="checkbox" id="ccCatFunctional"><span class="cc-slider"></span></label>
        </div>
      </div>
      <div class="cc-cat">
        <div class="cc-cat-head">
          <div><h3 id="ccCatAnalyticsH"></h3><p id="ccCatAnalyticsP"></p></div>
          <label class="cc-toggle"><input type="checkbox" id="ccCatAnalytics"><span class="cc-slider"></span></label>
        </div>
      </div>
      <div class="cc-cat">
        <div class="cc-cat-head">
          <div><h3 id="ccCatMarketingH"></h3><p id="ccCatMarketingP"></p></div>
          <label class="cc-toggle"><input type="checkbox" id="ccCatMarketing"><span class="cc-slider"></span></label>
        </div>
      </div>
    </div>
    <div class="cc-links">
      <a href="privacy.html" id="ccPrefPrivacyLink"></a>
      <a href="cookie-policy.html" id="ccPrefPolicyLink"></a>
    </div>
    <div class="cc-modal-actions">
      <button class="cc-btn cc-btn-primary" id="ccPrefAccept"></button>
      <button class="cc-btn cc-btn-primary" id="ccPrefReject"></button>
      <button class="cc-btn cc-btn-ghost" id="ccPrefSave"></button>
    </div>
    <div class="cc-back"><button id="ccBack">Back</button></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var VERSION = 1;              /* policy version - bump when the consent questions change */
  var RENEW_MS = 180 * 24 * 60 * 60 * 1000;  /* 6-month recall (Garante reference interval) */
  var KEY = 'lexflow-consent';

  var COPY = {
    en: {
      title:'Your privacy choices',
      body:'LexFlow uses strictly necessary cookies to make the website work. With your permission, we also use optional cookies and similar technologies to understand how the site is used and to measure or personalise marketing. You can accept all optional cookies, reject them, or choose by category. You can change your choice at any time in Cookie Settings.',
      accept:'Accept all', reject:'Reject non-essential', manage:'Manage preferences',
      privacy:'Privacy Notice', policy:'Cookie Policy', close:'Close',
      prefTitle:'Cookie preferences',
      prefIntro:'Choose which optional categories LexFlow may use. Strictly necessary cookies are always active because they are needed to provide the site and protect it from abuse.',
      neededH:'Strictly necessary', neededP:'These cookies are required for core website functions, security, load balancing, fraud prevention, remembering your cookie choice and, where applicable, authentication. They cannot be switched off in our systems.', always:'Always active',
      functionalH:'Functional', functionalP:'These cookies remember choices such as language, interface preferences or embedded-content settings. They are not required for the website to work.',
      analyticsH:'Analytics', analyticsP:'These cookies help us understand how visitors use LexFlow, such as pages viewed, traffic source, device type and site performance. We use aggregated reporting to improve the product and website.',
      marketingH:'Marketing', marketingP:'These cookies and similar technologies may be used to measure campaigns, build audiences, limit repeated ads and show advertising that is more relevant to you on third-party services. They may be set by LexFlow or by our advertising partners.',
      save:'Save my choices', back:'Back'
    },
    it: {
      title:'Le tue preferenze sulla privacy',
      body:'LexFlow utilizza cookie strettamente necessari per il funzionamento del sito. Solo con il tuo consenso utilizziamo cookie e tecnologie analoghe facoltativi per comprendere l\'utilizzo del sito e per misurare o personalizzare le attività di marketing. Puoi accettare tutti i cookie facoltativi, rifiutarli oppure scegliere per categoria. Puoi modificare la tua scelta in qualsiasi momento nelle Impostazioni cookie.',
      accept:'Accetta tutti', reject:'Rifiuta i cookie non necessari', manage:'Gestisci preferenze',
      privacy:'Informativa Privacy', policy:'Cookie Policy', close:'Chiudi',
      prefTitle:'Preferenze sui cookie',
      prefIntro:'Puoi scegliere quali categorie facoltative LexFlow può utilizzare. I cookie strettamente necessari rimangono sempre attivi perché necessari per fornire il sito e proteggerlo da utilizzi illeciti.',
      neededH:'Cookie strettamente necessari', neededP:'Sono necessari per le funzionalità essenziali del sito, la sicurezza, il bilanciamento del carico, la prevenzione delle frodi, la memorizzazione della scelta sui cookie e, ove applicabile, l\'autenticazione. Non possono essere disattivati nei nostri sistemi.', always:'Sempre attivi',
      functionalH:'Funzionali', functionalP:'Memorizzano scelte come lingua, preferenze dell\'interfaccia o impostazioni per contenuti incorporati. Non sono necessari per il funzionamento del sito.',
      analyticsH:'Analitici', analyticsP:'Ci aiutano a comprendere come i visitatori utilizzano LexFlow, ad esempio pagine visitate, provenienza del traffico, tipo di dispositivo e prestazioni del sito. Utilizziamo report aggregati per migliorare prodotto e sito.',
      marketingH:'Marketing', marketingP:'Questi cookie e tecnologie analoghe possono essere utilizzati per misurare le campagne, creare pubblici, limitare la ripetizione degli annunci e mostrare pubblicità più pertinente su servizi di terze parti. Possono essere impostati da LexFlow o dai partner pubblicitari.',
      save:'Salva le mie preferenze', back:'Indietro'
    },
    ru: {
      title:'Ваши настройки конфиденциальности',
      body:'LexFlow использует строго необходимые cookie для работы сайта. Только с вашего согласия мы также используем необязательные cookie и аналогичные технологии, чтобы понимать, как используется сайт, а также измерять или персонализировать маркетинг. Вы можете принять все необязательные cookie, отклонить их или выбрать категории отдельно. Вы можете изменить выбор в любой момент в разделе «Настройки cookie».',
      accept:'Принять все', reject:'Отклонить необязательные cookie', manage:'Настроить предпочтения',
      privacy:'Политика конфиденциальности', policy:'Политика cookie', close:'Закрыть',
      prefTitle:'Предпочтения по cookie',
      prefIntro:'Выберите, какие необязательные категории может использовать LexFlow. Строго необходимые cookie всегда активны, потому что нужны для работы сайта и защиты от злоупотреблений.',
      neededH:'Строго необходимые', neededP:'Эти cookie необходимы для основных функций сайта, безопасности, балансировки нагрузки, предотвращения мошенничества, запоминания вашего выбора по cookie и, где применимо, аутентификации. Их нельзя отключить в наших системах.', always:'Всегда активны',
      functionalH:'Функциональные', functionalP:'Эти cookie запоминают такие настройки, как язык, предпочтения интерфейса или настройки встроенного контента. Они не требуются для работы сайта.',
      analyticsH:'Аналитические', analyticsP:'Эти cookie помогают нам понимать, как посетители используют LexFlow: просмотренные страницы, источник трафика, тип устройства и производительность сайта. Мы используем агрегированные отчёты, чтобы улучшать продукт и сайт.',
      marketingH:'Маркетинговые', marketingP:'Эти cookie и аналогичные технологии могут использоваться для измерения кампаний, создания аудиторий, ограничения повторного показа рекламы и показа более релевантной рекламы в сторонних сервисах. Их могут устанавливать LexFlow или наши рекламные партнёры.',
      save:'Сохранить мой выбор', back:'Назад'
    }
  };

  /* Locale must be resolved exactly the way assets/i18n.js resolves it. This CMP
     renders synchronously while the page is still parsing, which is BEFORE i18n.js
     applies the stored language on DOMContentLoaded. At that moment
     documentElement.lang is still whatever the static HTML declares, and on the
     root pages that is always "en" - which is why the dialog stayed in English
     even for a visitor reading the Italian or Russian version of the page.
     Prefer the explicit language pin, then the stored choice, and only then fall
     back to the document attribute. */
  function locale(){
    var lock = document.documentElement.getAttribute('data-lang-lock');
    var stored = null;
    try { stored = localStorage.getItem('lexflow-lang'); } catch(e){}
    var l = (lock || stored || document.documentElement.lang || 'en').toLowerCase();
    return (l==='it'||l==='ru')?l:'en';
  }
  function copy(){ return COPY[locale()] || COPY.en; }
  var has = function(){ try { return typeof localStorage !== 'undefined'; } catch(e){ return false; } };

  /* ---- consent record / 6-month recall ---- */
  function load(){
    if (!has()) return null;
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var c = JSON.parse(raw);
      if (!c || !c.v || !c.cats) return null;
      return c;
    } catch(e){ return null; }
  }
  function save(cats){
    if (!has()) return;
    var record = {
      v: VERSION, cats: {
        necessary: true,
        functional: !!(cats && cats.functional),
        analytics: !!(cats && cats.analytics),
        marketing: !!(cats && cats.marketing)
      },
      at: new Date().toISOString(), locale: locale()
    };
    try { localStorage.setItem(KEY, JSON.stringify(record)); } catch(e){}
    window.dispatchEvent(new CustomEvent('lexflow:consent', { detail: record }));
  }
  function current(){
    var c = load();
    if (!c) return { v: VERSION, cats: { necessary:true, functional:false, analytics:false, marketing:false } };
    return c;
  }
  function isStale(){
    var c = load();
    if (!c) return true;
    if (Number(c.v) !== VERSION) return true;
    var t = Date.parse(c.at);
    if (isNaN(t)) return true;
    return (Date.now() - t) > RENEW_MS;
  }

  /* ---- public API (used by the site + future gated tags) ---- */
  window.LexConsent = {
    get: current,
    has: function(cat){ return !!(current().cats[cat]); },
    openBanner: function(){ show('banner'); },
    openPreferences: function(){ show('modal'); },
    clearAndAsk: function(){ try{ localStorage.removeItem(KEY); }catch(e){} show('banner'); }
  };

  var overlay = document.getElementById('ccOverlay');
  function show(kind){
    if (!overlay) return;
    overlay.hidden = false;
    overlay.style.display = 'flex';
    document.getElementById('ccBanner').hidden = (kind !== 'banner');
    document.getElementById('ccModal').hidden = (kind !== 'modal');
    var focusEl = kind === 'modal' ? document.getElementById('ccModal') : document.getElementById('ccBanner');
    if (focusEl) focusEl.focus();
  }
  function hide(){
    if (!overlay) return;
    overlay.hidden = true;
    overlay.style.display = 'none';   /* inline display beats the class rule */
  }
  function apply(cats){
    save(cats);
    hide();
    // gating hook: run any consent-conditional scripts
    if (window.__lexConsentGate) window.__lexConsentGate(cats);
  }

  function render(){
    if (!overlay) return;
    var T = copy();
    document.getElementById('ccBannerTitle').textContent = T.title;
    document.getElementById('ccBannerBody').textContent = T.body;
    document.getElementById('ccAcceptAll').textContent = T.accept;
    document.getElementById('ccReject').textContent = T.reject;
    document.getElementById('ccManage').textContent = T.manage;
    document.getElementById('ccPrivacyLink').textContent = T.privacy;
    document.getElementById('ccPolicyLink').textContent = T.policy;
    document.getElementById('ccClose').setAttribute('aria-label', T.close);
    document.getElementById('ccPrefTitle').textContent = T.prefTitle;
    document.getElementById('ccPrefIntro').textContent = T.prefIntro;
    document.getElementById('ccCatNeededH').textContent = T.neededH;
    document.getElementById('ccCatNeededP').textContent = T.neededP;
    document.getElementById('ccCatNeededAlways').textContent = T.always;
    document.getElementById('ccCatFunctionalH').textContent = T.functionalH;
    document.getElementById('ccCatFunctionalP').textContent = T.functionalP;
    document.getElementById('ccCatAnalyticsH').textContent = T.analyticsH;
    document.getElementById('ccCatAnalyticsP').textContent = T.analyticsP;
    document.getElementById('ccCatMarketingH').textContent = T.marketingH;
    document.getElementById('ccCatMarketingP').textContent = T.marketingP;
    document.getElementById('ccPrefAccept').textContent = T.accept;
    document.getElementById('ccPrefReject').textContent = T.reject;
    document.getElementById('ccPrefSave').textContent = T.save;
    document.getElementById('ccBack').textContent = T.back;
    document.getElementById('ccPrefPrivacyLink').textContent = T.privacy;
    document.getElementById('ccPrefPolicyLink').textContent = T.policy;
  }

  function setToggles(c){
    document.getElementById('ccCatFunctional').checked = !!(c.cats && c.cats.functional);
    document.getElementById('ccCatAnalytics').checked = !!(c.cats && c.cats.analytics);
    document.getElementById('ccCatMarketing').checked = !!(c.cats && c.cats.marketing);
  }
  function togglesToCats(){
    return {
      necessary: true,
      functional: document.getElementById('ccCatFunctional').checked,
      analytics: document.getElementById('ccCatAnalytics').checked,
      marketing: document.getElementById('ccCatMarketing').checked
    };
  }

  function bind(){
    if (!overlay) return;
    document.getElementById('ccAcceptAll').addEventListener('click', function(){ apply({functional:true,analytics:true,marketing:true}); });
    document.getElementById('ccReject').addEventListener('click', function(){ apply({functional:false,analytics:false,marketing:false}); });
    document.getElementById('ccManage').addEventListener('click', function(){ setToggles(current()); show('modal'); });
    document.getElementById('ccPrefAccept').addEventListener('click', function(){ apply({functional:true,analytics:true,marketing:true}); });
    document.getElementById('ccPrefReject').addEventListener('click', function(){ apply({functional:false,analytics:false,marketing:false}); });
    document.getElementById('ccPrefSave').addEventListener('click', function(){ apply(togglesToCats()); });
    document.getElementById('ccBack').addEventListener('click', function(){ show('banner'); });
    document.getElementById('ccClose').addEventListener('click', function(){ hide(); });
    document.getElementById('ccModalClose').addEventListener('click', function(){ hide(); });
    // closing keeps defaults: strictly necessary only, no consent inferred
    overlay.addEventListener('click', function(e){ if (e.target === overlay) hide(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !overlay.hidden) hide(); });
  }

  render();
  bind();
  /* i18n.js calls this when the visitor switches language, so the dialog follows the
     page instead of staying in whichever language it happened to first render in. */
  window.LexFlowCmpSync = render;

  /* ---- consent-gating for non-essential scripts.
     Future analytics/marketing/functional vendor scripts can be tagged with
     data-consent="analytics" (or functional/marketing) and add a loader into
     window.__lexConsentGate, which the consent record then drives. Nothing
     non-essential loads today, so this is the readiness + audit surface. ---- */
  window.__lexConsentGate = window.__lexConsentGate || function(cats){};

  /* ---- first paint / re-show logic (6-month recall) ---- */
  if (isStale()) {
    show('banner');
  }
})();
</script>
<!-- COOKIE CONSENT CMP:END -->



</body>
</html>
